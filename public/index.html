<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BuildingConnected — Bid Intelligence</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="error"></div>

  <section id="login-screen" class="login-screen" hidden>
    <div class="login-card">
      <span class="brand-mark brand-mark-lg">BC</span>
      <h1>BuildingConnected</h1>
      <p>Review projects, bid packages, and AI-analyzed bids — from award decision back to the data behind it.</p>
      <button id="login-btn" class="btn btn-primary">Log in with Autodesk</button>
    </div>
  </section>

  <div id="app-shell" hidden>
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark">BC</span>
        <div class="brand-text">
          <h1>BuildingConnected</h1>
          <p>Projects &amp; AI-analyzed bid comparison</p>
        </div>
      </div>
      <div class="header-actions">
        <div id="status" class="status-pill"></div>
        <button id="logout-btn" class="btn btn-secondary">Log out</button>
      </div>
    </header>
    <nav id="breadcrumb" class="breadcrumb"></nav>
    <main id="view-root" class="view-root"></main>
  </div>

  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
  <aside id="drawer" class="drawer" hidden aria-hidden="true">
    <div class="drawer-header">
      <h3 id="drawer-title"></h3>
      <button type="button" id="drawer-close" aria-label="Close details">✕</button>
    </div>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>

  <script type="module" src="js/main.js"></script>
</body>
</html>
